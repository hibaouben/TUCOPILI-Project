services:
  postgres:
    image: postgres:17
    container_name: tucopili-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tucopili
      POSTGRES_PASSWORD: tucopili_password
      POSTGRES_DB: tucopili_cafe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: